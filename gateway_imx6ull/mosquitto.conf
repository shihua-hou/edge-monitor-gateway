# ============================================================
# EdgeMonitor Gateway - mosquitto broker 配置（v2 认证版）
# ============================================================
# 用法：
#   1) 生成账号密码文件
#        sudo mosquitto_passwd -c /etc/mosquitto/passwd em     # 创建用户 em
#        sudo mosquitto_passwd /etc/mosquitto/passwd viewer    # 再加一个观看账号
#   2) 启动
#        sudo mosquitto -c mosquitto.conf
#   3) 网关进程
#        export MQTT_USER=em MQTT_PASS=<密码>
#        ./gateway_mqtt can0
#   4) Web 端用同一账号密码登录（页面已内置登录框）
# ============================================================

# --- 端口：1883(MQTT) + 8083(WebSocket，供浏览器 mqtt.js) ---
listener 1883
listener 8083
protocol websockets

# --- 可选：TLS WebSocket(wss)，部署到公网/frp 时必须启用，否则账号密码明文可见 ---
# web/index.html 里页面走 https 时会自动改连 wss://<host>:8084/mqtt，
# 对应这里打开一个 8084 的 TLS listener（证书用 certbot/自签均可）：
# listener 8084
# protocol websockets
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key

# --- 认证：禁止匿名连接 ---
allow_anonymous false
password_file /etc/mosquitto/passwd

# --- ACL：限制每个账号能读写哪些主题（强烈建议启用，否则任何认证账号，
#     包括本该只读的 viewer，都能往 monitor/cmd 发控制命令）---
# 之前这里默认打开 acl_file 却没有随配置一起提供 acl 文件本身，
# mosquitto 在文件不存在时会直接启动失败；现在默认注释掉，
# 按 acl.example 建好 /etc/mosquitto/acl 后再取消注释：
#   sudo cp acl.example /etc/mosquitto/acl
# acl_file /etc/mosquitto/acl

# --- 日志 ---
# 不要在这里写 log_dest：这份配置是被 /etc/mosquitto/mosquitto.conf 通过
# include_dir 加载的，写在这里会覆盖主配置的 "log_dest file"。服务方式
# （后台）启动时 stdout 是丢弃的，一旦启动失败，错误信息哪儿都看不到，
# 只能看到"服务没起来"这个结果——排查起来非常费劲。
# 手动前台调试想看输出时，命令行加 -v 即可，不用改配置。
#   log_dest stdout
connection_messages true
