# ============================================================
# 板载 MQTT Broker 配置（i.MX6ULL）
#
# 为什么把 broker 从虚拟机搬到板子上：
# 原来的数据流是
#     gateway_mqtt(板子) --> 你电脑的 portproxy --> 虚拟机的 broker --> Qt 界面(板子)
# 发送方和接收方**都在板子上**，中间却要绕一圈经过虚拟机。
# 虚拟机一关机，板子自己的界面就不刷新了、控制页也发不出指令——
# 一个本该自洽的嵌入式设备，被一台开发用的虚拟机卡住了脖子。
#
# 搬过来之后：车自己转起来不依赖任何上位机；虚拟机/Web 变成纯粹的
# **旁观者**，连得上就能看，连不上也只是看不到，不影响车跑。
#
# ── 为什么这里没有 8083 (WebSocket) ──
# 板子上这个 mosquitto 是交叉编译的，没有链 libwebsockets，不支持 ws。
# 浏览器只能走 WebSocket，所以 Web 大屏仍然连虚拟机上那个 broker，
# 由它**桥接**到这里取数据（见 deploy/board/bridge-to-board.conf）。
# 不为了 Web 把 libwebsockets 也交叉编译一遍，是因为：板子上跑 WS
# 只为了一个开发期的看板，不值当；而桥接是 mosquitto 原生能力，零代码。
# ============================================================

# mosquitto 默认启动后会降权到名为 mosquitto 的用户，而板子的精简 rootfs
# 里没有这个账号，不写这行会直接以 "Invalid user 'mosquitto'" 退出。
#
# 这里以 root 运行是**有代价的**：一个监听在局域网上的服务跑在 root 下，
# 万一被打穿就是整机权限。之所以接受：板子上 gateway_mqtt、Qt 界面、
# mobile_ctrl 本来就全是 root（要访问 CAN、framebuffer、GPIO），
# 单独给 broker 降权并不能把整体风险降下来。
# 真要收紧，应该是整套服务一起建非特权账号 + 给 CAN/fb 配 udev 权限，
# 那是另一件事，不该在这里半途而废地做一半。
user root

# 只开原生 MQTT。板子上的三个客户端（gateway_mqtt / gps_mqtt / Qt 界面）
# 都走 127.0.0.1，局域网里的桥接和调试工具走网口地址。
listener 1883

# 认证沿用和虚拟机同一套账号（口令文件是哈希后的，直接拷过来即可）。
# 不开匿名：这台车在园区 WiFi 上，任何人扫到 1883 就能发控制指令。
allow_anonymous false
password_file /home/root/mosquitto_passwd

# 主题权限表。没有它的话，任何一个认证通过的账号都能发控制指令、
# 也能读走 config 里的第三方密钥——认证只回答"你是谁"，
# 不回答"你能干什么"。
#
# 注意：文件不存在时 mosquitto **直接启动失败**（不是忽略），
# 所以改配置和放文件要一起做。
acl_file /home/root/mosquitto_acl

# 不做持久化。板子的根文件系统在 eMMC 上，broker 的 persistence
# 会周期性把保留消息和会话写盘——我们发的全是周期性遥测，
# 掉电后一秒就有新的，为这个磨损闪存不划算。
persistence false

# **不要用 log_dest stdout**：守护脚本把 stdout 重定向到文件，
# 而 C 库对文件是块缓冲（4KB），日志会攒够一整块才落盘。现象是
# 进程明明在跑、连接也建立了，日志文件却十几分钟一个字不变——
# 排查时会误以为 broker 卡死了。用 log_dest file 让 mosquitto
# 自己管这个文件，它按行刷，随时 tail 随时是最新的。
log_dest file /tmp/em_mosquitto.log
connection_messages true
# **不要在这里列 log_type**。一旦显式写了任何一条，mosquitto 就用你列的
# 这几类**替换**默认集合，而默认集合里的 information 恰好包含启动时那几行
# "配置从哪加载、口令文件读没读到、监听在哪"——过滤掉之后，
# 认证失败时日志里只剩一串 "New connection / Socket error"，
# 看不出是密码错、文件没读到、还是端口不对。踩过一次，排查多花了半小时。
