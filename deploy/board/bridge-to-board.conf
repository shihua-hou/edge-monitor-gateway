# ============================================================
# 虚拟机侧：桥接到板载 broker
#
# 数据的**源头**是板子上的 broker，这台虚拟机只是个转发者：
#     板子 broker(1883) <--bridge-- 虚拟机 broker --ws:8083--> 浏览器大屏
#
# 为什么还需要虚拟机这一跳：浏览器只能走 WebSocket，而板子上那个
# mosquitto 是交叉编译的、没链 libwebsockets。与其为一个开发期看板
# 把 libwebsockets 也交叉编译一遍，不如用 mosquitto 原生的桥接能力——零代码。
#
# 关掉虚拟机会怎样：Web 大屏看不到数据，**车照常跑**。
# 这正是把 broker 搬到板子上的目的：上位机退化成旁观者。
#
# 安装（需要 root）：
#     sudo cp bridge-to-board.conf /etc/mosquitto/conf.d/
#     sudo systemctl restart mosquitto
# ============================================================

connection board
# 用主机名而不是 IP。板子是 DHCP 拿地址的，而那台移动 WiFi 路由器
# 做不了地址绑定——实际已经 .3 → .5 → .3 换过两轮，每换一次桥接就断，
# 大屏停在最后一帧，看着像板子坏了。
# 板子上跑着 avahi，会在局域网里用 mDNS 广播 ATK-IMX6U.local；
# mosquitto 每次重连都会重新解析，板子换了地址下一次重连自动跟上。
# 前提是 VM 能解析 .local（Ubuntu 默认装了 libnss-mdns）：
#     getent hosts ATK-IMX6U.local   应返回板子当前 IP
address ATK-IMX6U.local:1883

# 逐条列方向，而不是一条 monitor/# both 全覆盖。
#   in  = 从板子拉过来（遥测、在线状态、OTA 进度）
#   out = 从这里送下去（控制指令、OTA 指令）
#
# 为什么不用 both 图省事：**config/# 绝不能出现在这张表里**。
# 一条 monitor/# both 会把语音助手的第三方密钥一并搬到虚拟机上，
# 那就白改了——板子上的 ACL 刚把这条路堵死。
# 代价是以后加新主题要回来补一行；漏了的表现是"某个面板一直空着"
# 而其它正常，所以加主题时记得连这里一起改。
topic monitor/+/data/#      in  0
topic monitor/online/+      in  0
topic monitor/+/ota/progress in 0
topic monitor/+/ota/status  in  0
topic monitor/+/cmd         out 0
topic monitor/+/ota/cmd     out 0
# config **只有 out，没有 in**——这一条是整张表的关键：
#   out：Web 端下发语音密钥 -> 板子（这条路必须留着，否则设置页失效）
#   没有 in：板子上的密钥绝不会被搬到虚拟机上来
# 同一个主题两个方向的安全含义完全不同，所以不能图省事写 both。
topic monitor/+/config/#    out 0

# 桥接自己的身份。**必须和板子上的客户端不同名**：
# MQTT 规定同名客户端后来者顶掉先到者，重名会让两边无限互踢，
# 现象是数据一阵一阵地来、日志刷满 "Socket error"。
remote_clientid bridge_vm_to_board
# **用专门的 bridge 账号，不要用设备账号 em。**
# 板子的 ACL（deploy/board/acl-board）按读写方向分了三个账号：
#   em 只发遥测、收指令；ui 只读遥测、发指令；bridge 读遥测、送指令进来。
# 桥接需要的方向和 em 正好相反，用 em 就得给 em 放开"发指令"的权限，
# ACL 等于白分。
# 更要紧的一点：bridge 账号**读不到 monitor/+/config/#**——
# 语音助手那套第三方密钥没有任何理由离开这块板子。
remote_username bridge
remote_password __在安装前替换成真实密码__

# 断线重连的等待时间。
# **只能写一个值**：两个值（起步/上限的指数退避）是 mosquitto 1.6 才加的，
# 而虚拟机上这个是 1.4.15——它解析不了，会在启动时报配置错误直接退出，
# 表现是"装上桥接之后整个 broker 起不来"，连带 Web 大屏一起黑。
# 跨版本抄配置最容易踩这种：语法看着通用，其实是某个版本之后才有的。
restart_timeout 10

# 不做本地持久化转发：这条链路上跑的全是周期性遥测，
# 断线期间积压的旧数据重连后一股脑涌过来，只会让大屏上的曲线错位。
cleansession true

# 桥接连接的日志。出问题时先看这里有没有 "Connecting bridge"/"Bridge ... sending CONNECT"
notifications false
